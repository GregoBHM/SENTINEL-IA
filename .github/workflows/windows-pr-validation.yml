name: Windows PR validation

on:
  pull_request:
    # Validate stacked PRs as well as PRs targeting main.
  push:
    # Validate this experimental stacked branch while its dependencies
    # remain open; main will keep the general pull_request trigger.
    branches: [feat/v2-process-persistence-identity]

permissions:
  contents: read

jobs:
  windows-smoke-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
      - name: Install Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Run unit tests, GUI smoke and validate Windows package
        shell: pwsh
        run: .\build_windows.ps1
      - name: Install optional YARA-X evaluation wheel (not bundled in EXE)
        if: success()
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install --only-binary=:all: yara-x==1.22.1
          if ($LASTEXITCODE -ne 0) { throw 'Optional YARA-X evaluation wheel unavailable.' }
      - name: Validate YARA and YARA-X parity, ZIP and config
        if: success()
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest -q tests/test_yara_x_engine.py tests/test_yara_backend_benchmark.py
          if ($LASTEXITCODE -ne 0) { throw 'YARA-X evaluation tests failed.' }
      - name: Benchmark identical harmless YARA fixtures
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'artifacts/yara-evaluation' -Force | Out-Null
          .\.venv\Scripts\python.exe -m tools.benchmark_yara_backends --files 24 --rounds 3 | Out-File -FilePath 'artifacts/yara-evaluation/yara-parity.json' -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'YARA vs YARA-X parity disagreed.' }
          Get-Content 'artifacts/yara-evaluation/yara-parity.json'
      - name: Upload YARA-X compatibility report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-oneguard-yarax-evaluation
          path: artifacts/yara-evaluation/yara-parity.json
          if-no-files-found: error
      - name: Measure synthetic local hash throughput
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'artifacts/performance' -Force | Out-Null
          .\.venv\Scripts\python.exe -m tools.benchmark_scanner --files 150 --workers 3 | Out-File -FilePath 'artifacts/performance/hash-baseline.json' -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic hash benchmark failed.' }
          Get-Content 'artifacts/performance/hash-baseline.json'
      - name: Upload synthetic performance baseline
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-oneguard-performance-baseline
          path: artifacts/performance/hash-baseline.json
          if-no-files-found: error
      - name: Show SHA-256 for unsigned experimental binary
        if: success()
        shell: pwsh
        run: Get-Content .\dist\SentinelOneGuard.sha256.txt
      - name: Capture GUI layout previews (no scanning, synthetic example)
        if: success()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\.venv\Scripts\python.exe -m tools.capture_gui_previews
      - name: Upload GUI screenshots for visual QA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-oneguard-ui-previews
          path: artifacts/gui-previews/*.png
          if-no-files-found: error
      - name: Upload unsigned Windows EXE (experimental — test in VM)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SentinelOneGuard-Windows-EXE-Experimental
          path: |
            dist/SentinelOneGuard.exe
            dist/SentinelOneGuard.sha256.txt
            docs/BUILD_WINDOWS.md
          if-no-files-found: error
          retention-days: 30
